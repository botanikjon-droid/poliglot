plugins { id 'com.android.application' }
android {
  namespace 'uz.ecolab.poliglot'
  compileSdk 34
  defaultConfig {
    applicationId 'uz.ecolab.poliglot'
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  signingConfigs {
    fixed {
      storeFile file('poliglot.keystore')
      storePassword 'poliglot'
      keyAlias 'poliglot'
      keyPassword 'poliglot'
    }
  }
  buildTypes {
    debug { signingConfig signingConfigs.fixed }
    release { minifyEnabled false; signingConfig signingConfigs.fixed }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
