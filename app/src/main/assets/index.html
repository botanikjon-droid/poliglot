<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Poliglot</title>
<style>
:root{
  /* Poliglot: navy ink + signal orange; single scroll column, fixed bottom tabs */
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6680; --line:#D9DFEA;
  --accent:#E85D2A; --accent-soft:#FDE9E1; --ok:#1F9D6B; --ok-soft:#E1F4EC; --ar:#2D6CDF; --ar-soft:#E4EDFC;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"Noto Naskh Arabic","Noto Sans Arabic","Amiri",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body{padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{width:18px;height:18px;fill:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ar{background:var(--ar-soft);color:var(--ar)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on svg{opacity:1}
.task .body{flex:1;display:flex;flex-direction:column;gap:3px}
.task .t{font-weight:700}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.mins{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px;text-align:left}
.link.ar{color:var(--ar)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ar{background:var(--ar)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.icon{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px;fill:var(--ink)}
.icon.rec svg{fill:var(--accent)}
.phr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.phr .en{font-weight:700}
.ar-text{font-family:var(--font-ar);font-size:24px;line-height:1.5;direction:rtl;text-align:right;font-weight:600}
.ar-big{font-family:var(--font-ar);font-size:56px;line-height:1.2;direction:rtl}
.tr{font-size:13px;color:var(--ar);font-style:italic}
.uz{font-size:14px;color:var(--muted)}
.score{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.hint{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.tabs svg{width:22px;height:22px;fill:currentColor}
.tabs button.on{color:var(--accent)}
.grid30{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;padding:0;font-size:15px}
.dcell small{font-size:9px;font-weight:700;color:var(--muted)}
.dcell.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.dcell.done small{color:#fff}
.dcell.cur{border:2px solid var(--accent);color:var(--accent)}
.dcell.rev{background:var(--accent-soft)}
.dcell.done.rev{background:var(--ok)}
.wk{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.12)}
.flash{min-height:230px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.flash .front{font-size:22px;font-weight:800}
.timer{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.recrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.recrow:first-child{border-top:0}
audio{width:100%;height:40px}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--line);padding-top:8px}
.chart i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.chart i.zero{background:var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=time],select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hidden{display:none!important}
</style>
</head>

function streak(){
  const has=k=>(S.act[k]||0)>0; let n=0; const d=new Date();
  const key=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!has(key(d))) d.setDate(d.getDate()-1);

const NA=window.Android||null;
let toastT;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3200);}
function speak(text,lang){
  const tag=lang==="ar"?"ar-SA":"en-US", rate=lang==="ar"?0.75:0.9;
  if(NA&&NA.speak){
    const r=NA.speak(text.replace(/\.\.\./g,""),tag,rate);
    if(r==="missing"){toast(lang==="ar"?"Telefonda arab ovozi yo'q. O'sish → Sozlamalar → 'Ovoz sozlamalari' dan Arab tilini yuklang.":"Ingliz ovozi topilmadi.");}
    else if(r==="notready"){toast("Ovoz tayyorlanmoqda, yana bosing.");}
    return;
  }
  if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(text);u.lang=tag;u.rate=rate;speechSynthesis.cancel();speechSynthesis.speak(u);}
  else toast("Bu qurilmada ovoz yo'q.");
}
function recognize(lang){
  const tag=lang==="ar"?"ar-SA":"en-US";
  return new Promise((res,rej)=>{
    if(NA&&NA.listen){window.__sr=(t,e)=>{e?rej(e):res(t);};NA.listen(tag);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){rej("nosr");return;}
    const r=new SR();r.lang=tag;r.maxAlternatives=1;r.onresult=e=>res(e.results[0][0].transcript);r.onerror=e=>rej(e.error);r.start();
  });
}
function micPerm(){return new Promise(res=>{if(!NA||!NA.ensureMic){res(true);return;}window.__mic=g=>res(!!g);NA.ensureMic();});}
function norm(s,lang){
  s=s.toLowerCase();
  if(lang==="ar"){s=s.replace(/[ً-ْٰـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");}
  return s.replace(/\.\.\./g," ").replace(/[^\p{L}\p{N}\s']/gu," ").split(/\s+/).filter(Boolean);
}
function similarity(target,heard,lang){
  const t=norm(target,lang),h=norm(heard,lang);if(!t.length)return 0;
  const pool=h.slice();let hit=0;
  t.forEach(w=>{const i=pool.indexOf(w);if(i>=0){hit++;pool.splice(i,1);}});
  return Math.round(hit/t.length*100);
}
async function checkSay(target,lang,el){
  try{
    const heard=await recognize(lang);
    const sc=similarity(target,heard||"",lang);
    const k=today();(S.sc[k]=S.sc[k]||[]).push(sc);save();
    if(el){el.innerHTML=`<span class="score" style="color:${sc>=70?"var(--ok)":"var(--accent)"}">${sc}%</span> <span class="muted">Eshitildi: “${esc(heard||"")}”</span>`;}
    toast(sc>=85?"Ajoyib talaffuz!":sc>=70?"Yaxshi! Yana bir marta tinglab ko'ring.":"Diktorni tinglab, sekinroq qayta ayting.");
  }catch(e){
    if(e==="cancel")return;
    toast(e==="nosr"?"Ovozni tanish xizmati yo'q. Google ilovasini o'rnating/yangilang.":"Tushunilmadi, yana urinib ko'ring.");
  }
}

let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("poliglot",1);r.onupgradeneeded=()=>r.result.createObjectStore("recs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return dbp;}
async function recAll(){const db=await idb();return new Promise(res=>{const out=[];const c=db.transaction("recs").objectStore("recs").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push(cur.value);cur.continue();}else res(out.sort((a,b)=>b.id-a.id));};c.onerror=()=>res(out);});}
async function recPut(o){const db=await idb();return new Promise(res=>{const tx=db.transaction("recs","readwrite");tx.objectStore("recs").put(o);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
async function recDel(id){const db=await idb();return new Promise(res=>{const tx=db.transaction("recs","readwrite");tx.objectStore("recs").delete(id);tx.oncomplete=()=>res();});}
let mr=null,chunks=[],recStart=0,recTick=null,urls=[];
async function startRec(label){
  const ok=await micPerm(); if(!ok){toast("Mikrofonga ruxsat berilmadi. Telefon sozlamalaridan ruxsat bering.");return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];mr=new MediaRecorder(stream);
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
      const dur=Math.round((Date.now()-recStart)/1000);
      await recPut({id:Date.now(),day:UI.day,date:today(),label:label,dur:dur,blob:blob});
      mr=null;clearInterval(recTick);toast("Yozuv saqlandi ("+dur+" s)");render();
    };
    recStart=Date.now();mr.start();
    recTick=setInterval(()=>{const el=document.getElementById("recTime");if(el){const s=Math.round((Date.now()-recStart)/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}},500);
    render();
  }catch(e){toast("Yozib bo'lmadi: mikrofon band yoki ruxsat yo'q.");}
}

   <p class="muted" style="margin:0">Ingliz tili (B1) 20 daqiqa: ravon gapirish. Arab tili (0 dan) 10 daqiqa: alifbodan dialoggacha. Har 7-kun haftalik nazorat.</p></div>
   ${WEEKS.map(w=>{const from=(w.n-1)*7+1,to=w.n===4?30:w.n*7;const days=[];for(let d=from;d<=to;d++)days.push(d);
   return `<div class="card wk"><div class="row between"><h3>${w.n}-hafta: ${w.name}</h3><span class="muted">${from}-${to}</span></div>
    <span class="muted"><b>Maqsad:</b> ${w.goal}</span>
    <div class="grid30">${days.map(d=>{const r=EN_DAYS[d-1][0]==="R";return `<button class="dcell ${S.done[d]?"done":""} ${d===cd?"cur":""} ${r?"rev":""}" onclick="UI.day=${d};go('bugun')" aria-label="${d}-kun">${d}<small>${r?"nazorat":S.done[d]?"✓":""}</small></button>`;}).join("")}</div>
    <div class="muted">${days.map(d=>`${d}. ${EN_DAYS[d-1][0]==="R"?"Haftalik nazorat":EN_DAYS[d-1][0]} · <span style="color:var(--ar)">${AR_DAYS[d-1][0]}</span>`).join("<br>")}</div></div>`;}).join("")}`;
}
function deck(){
  if(UI.deck==="en")return EN.map((p,i)=>({k:"en"+i,front:p[1],back:p[2],sub:EN_CAT[p[0]],lang:"en"}));
  if(UI.deck==="arl")return AR_L.map((x,i)=>({k:"l"+i,front:x[0],back:x[1]+" · "+x[2],sub:x[3],lang:"ar",big:1}));
  return AR_P.map((x,i)=>({k:"p"+i,front:x[2],back:x[0],sub:x[1],lang:"ar",rev:1}));
}
function vKarta(){
  if(UI.deck==="ar")UI.deck="arl";
  const D=deck(),kn=S.known[UI.deck]||{};const left=D.filter(c=>!kn[c.k]);
  const list=left.length?left:D;if(UI.ci>=list.length)UI.ci=0;const c=list[UI.ci];
  const front=c.big?`<div class="ar-big">${c.front}</div>`:c.rev?`<div class="front">${esc(c.front)}</div>`:`<div class="front">${esc(c.front)}</div>`;
  const back=c.rev?`<div class="ar-text" style="text-align:center">${esc(c.back)}</div><div class="tr">${esc(c.sub)}</div>`:`<div class="front" style="color:var(--muted);font-size:18px">${esc(c.back)}</div><div class="muted">${esc(c.sub)}</div>`;
  return `<div class="seg">${[["en","Ingliz iboralar"],["arl","Arab harflari"],["arp","Arab iboralar"]].map(x=>`<button class="${UI.deck===x[0]?"on":""}" onclick="UI.deck='${x[0]}';UI.ci=0;UI.flip=false;render()">${x[1]}</button>`).join("")}</div>
  <div class="row between"><span class="muted">Bilaman: ${Object.keys(kn).length} / ${D.length}</span>${Object.keys(kn).length?`<button class="link" onclick="S.known['${UI.deck}']={};save();render()">Qaytadan</button>`:""}</div>
  <button class="flash" onclick="UI.flip=!UI.flip;render()" aria-label="Kartochkani aylantirish">${front}${UI.flip?back:'<span class="muted">Javobni ko\'rish uchun bosing</span>'}</button>
  <div class="btns"><button class="btn sec" style="flex:1" onclick="speak(${JSON.stringify(c.rev?c.back:c.front).replace(/"/g,"&quot;")},'${c.lang}')">${ICON.spk.replace("<svg","<svg width='18' height='18' fill='currentColor'")} Tinglash</button>
   ${c.big?"":`<button class="btn sec" style="flex:1" onclick="checkSay(${JSON.stringify(c.rev?c.back:c.front).replace(/"/g,"&quot;")},'${c.lang}',document.getElementById('cs'))">${ICON.mic.replace("<svg","<svg width='18' height='18' fill='currentColor'")} Ayting</button>`}</div>
  <div id="cs"></div>
  <div class="btns"><button class="btn sec" style="flex:1" onclick="UI.ci++;UI.flip=false;render()">Takrorlash</button><button class="btn ok" style="flex:1" onclick="(S.known['${UI.deck}']=S.known['${UI.deck}']||{})['${c.k}']=1;save();UI.flip=false;render()">Bilaman</button></div>`;
}
let recCache=[];
function vMashq(){
  const d=UI.day,e=EN_DAYS[d-1];
  return `<div class="card"><span class="eyebrow">Gapirish taymeri</span>
    <div class="timer" id="tm">${fmt(tmLeft)}</div>
    <div class="seg">${[60,120,180,300].map(s=>`<button class="${tmSet===s?"on":""}" onclick="tmSet=${s};tmLeft=${s};clearInterval(tmInt);tmInt=null;render()">${s/60} daq</button>`).join("")}</div>
    <button class="btn" onclick="tmStart()">${tmInt?"To'xtatish":"Boshlash"}</button>
    <span class="muted">Qoida: to'xtamang. So'z topilmasa, boshqacha tushuntiring.</span></div>
  <div class="card"><span class="eyebrow">O'zingizni yozib oling</span>
    <h3>${d}-kun: ${e[0]==="R"?"Haftalik nazorat":esc(e[0])}</h3>
    ${mr?`<div class="row"><span class="recdot"></span><b id="recTime">0:00</b><span class="muted">yozilmoqda...</span></div><button class="btn" onclick="stopRec()">To'xtatish va saqlash</button>`
       :`<button class="btn" onclick="startRec('${(e[0]==="R"?"Haftalik nazorat":e[0]).replace(/'/g,"’")}')">${ICON.mic.replace("<svg","<svg width='18' height='18' fill='#fff'")} Yozishni boshlash</button>`}
    <span class="muted">Tinglaganda e'tibor bering: pauzalar, "e-e"lar, topilmagan so'zlar.</span>
    <div id="reclist"><span class="muted">Yuklanmoqda...</span></div></div>`;
}
async function fillRecs(){
  const box=document.getElementById("reclist");if(!box)return;
  try{recCache=await recAll();}catch(e){recCache=[];}
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  box.innerHTML=recCache.length?recCache.slice(0,12).map(r=>`<div class="recrow"><div class="row between"><b>${r.day}-kun · ${esc(r.label)}</b><span class="mins">${r.date} · ${r.dur}s</span></div><audio controls preload="none" src="${blobUrl(r.blob)}"></audio><button class="link" onclick="recDel(${r.id}).then(render)">O'chirish</button></div>`).join(""):'<span class="muted">Hali yozuv yo\'q.</span>';
}
async function fillCompare(){
  const box=document.getElementById("cmp");if(!box)return;
  let all=[];try{all=await recAll();}catch(e){}
  if(all.length<1){box.innerHTML='<span class="muted">Yozuvlar paydo bo\'lgach, birinchi va oxirgisi shu yerda chiqadi.</span>';return;}
  const first=all[all.length-1],last=all[0];
  box.innerHTML=`<div class="recrow"><b>Birinchi: ${first.day}-kun (${first.date})</b><audio controls preload="none" src="${blobUrl(first.blob)}"></audio></div>`+(last.id!==first.id?`<div class="recrow"><b>Oxirgi: ${last.day}-kun (${last.date})</b><audio controls preload="none" src="${blobUrl(last.blob)}"></audio></div>`:"");
}
function vOsish(){
  const days=Object.keys(S.done).length,st=streak(),tm=totalMin();
  const bars=[];for(let d=1;d<=30;d++){const k=S.done[d];const sc=k?avgScore(k):null;bars.push(`<i class="${k?"":"zero"}" style="height:${k?Math.max(10,sc==null?60:sc):2}%" title="${d}-kun"></i>`);}
  const scT=avgScore(today());
  return `<div class="card"><span class="eyebrow">Umumiy natija</span>
    <div class="stats"><div class="stat"><b>${days}/30</b><span>kun bajarildi</span></div><div class="stat"><b>${st}</b><span>kunlik seriya</span></div><div class="stat"><b>${tm}</b><span>daqiqa</span></div></div>
    <div class="bar"><i style="width:${Math.round(days/30*100)}%"></i></div></div>
  <div class="card"><h3>Kunlar bo'yicha talaffuz balli</h3><div class="chart">${bars.join("")}</div><div class="row between muted"><span>1-kun</span><span>30-kun</span></div>
    <span class="muted">Bugungi o'rtacha ball: ${scT==null?"hali tekshirilmadi":scT+"%"}</span></div>
  <div class="card"><h3>Ovozingiz qanday o'zgardi</h3><div id="cmp"><span class="muted">Yuklanmoqda...</span></div></div>
  <div class="card"><h3>Kunlik hisobot</h3><span class="muted">Har kuni kechqurun hisobotni Claude'ga yuboring: men tekshirib, ertangi kunga maslahat beraman.</span>
    <button class="btn" onclick="sendReport()">Hisobotni yuborish</button></div>
  <div class="card"><h3>Sozlamalar</h3>
    <div class="row between"><label for="rt">Kunlik eslatma vaqti</label><input type="time" id="rt" value="${S.remind}"></div>
    <div class="btns"><button class="btn sm" onclick="setRemind()">${S.remindOn?"Vaqtni yangilash":"Eslatmani yoqish"}</button>${S.remindOn?'<button class="btn sec sm" onclick="offRemind()">O\'chirish</button>':""}</div>
    ${NA&&NA.openTtsSettings?'<button class="btn sec sm" onclick="Android.openTtsSettings()">Ovoz sozlamalari (arab ovozini yuklash)</button>':""}
    <span class="muted">Arab tilini tinglash uchun telefonda Google "Matnni nutqqa aylantirish" ichida Arab tili yuklangan bo'lishi kerak.</span></div>`;
}
function report(){
  const d=curDay(),last=Object.keys(S.done).map(Number).sort((a,b)=>b-a)[0]||0;
  const k=today(),sc=avgScore(k);
  const en=S.en[UI.day]||[],ar=S.ar[UI.day]||[];
  return `Poliglot hisobot · ${k}
Bugun ko'rilgan kun: ${UI.day}-kun (${EN_DAYS[UI.day-1][0]==="R"?"Haftalik nazorat":EN_DAYS[UI.day-1][0]})
Ingliz: ${en.filter(Boolean).length}/${enTasks(UI.day).length} vazifa · Arab: ${ar.filter(Boolean).length}/${arTasks(UI.day).length} vazifa
Bugun: ${S.act[k]||0} daqiqa · Talaffuz: ${sc==null?"tekshirilmadi":sc+"%"}
Jami: ${Object.keys(S.done).length}/30 kun · Seriya: ${streak()} kun · Oxirgi tugallangan: ${last||"-"}-kun
Qiyin bo'ldi:
Yangi o'rgandim: `;
}
function sendReport(){
  const t=report();
  if(NA&&NA.share){NA.share(t);return;}
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast("Hisobot nusxalandi. Claude'ga joylang.")).catch(()=>toast("Nusxalab bo'lmadi"));}
}
function setRemind(){const v=document.getElementById("rt").value||"20:00";S.remind=v;S.remindOn=true;save();const [h,m]=v.split(":").map(Number);if(NA&&NA.setReminder){NA.setReminder(h,m);toast("Har kuni "+v+" da eslatma keladi");}else toast("Eslatma faqat Android ilovada ishlaydi");render();}
function offRemind(){S.remindOn=false;save();if(NA&&NA.cancelReminder)NA.cancelReminder();toast("Eslatma o'chirildi");render();}

function render(){
  document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="${UI.tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[2]}<span>${t[1]}</span></button>`).join("");
  const head=`<header class="top"><div class="brand">Poli<span>glot</span></div><div class="streak" title="Kunlik seriya">${ICON.fire}<span>${streak()} kun</span></div></header>`;
  const v={bugun:vBugun,dastur:vDastur,karta:vKarta,mashq:vMashq,osish:vOsish}[UI.tab]();
  document.getElementById("app").innerHTML=head+v;
  if(UI.tab==="mashq")fillRecs();
  if(UI.tab==="osish")fillCompare();
}
render();
</script>
</body>
</html>
