name: APK yig'ish
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk poliglot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poliglot-apk
          path: poliglot.apk
      - name: Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest poliglot.apk --title "Poliglot (build ${{ github.run_number }})" --notes "Telefonda shu sahifani oching, poliglot.apk ni yuklab o'rnating. Yangilash uchun ham shu faylni qayta o'rnating: ma'lumotlar saqlanib qoladi."
