name: APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Imzo kaliti
        env:
          KEYSTORE_B64: ${{ secrets.POLIGLOT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/poliglot.keystore"
            echo "POLIGLOT_KEYSTORE_PATH=$RUNNER_TEMP/poliglot.keystore" >> "$GITHUB_ENV"
            echo "Kalit GitHub Secret'dan olindi"
          elif [ -f app/poliglot.keystore ]; then
            echo "::warning::POLIGLOT_KEYSTORE_B64 qo'shilmagan, vaqtincha repodagi kalit ishlatildi"
          else
            echo "::error::POLIGLOT_KEYSTORE_B64 maxfiy qiymati yo'q: Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: APK yig'ish
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/release/app-release.apk poliglot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poliglot-apk
          path: poliglot.apk

      - name: Release'ga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest poliglot.apk \
            --title "Poliglot — so'nggi versiya (build ${{ github.run_number }})" \
            --notes "Telefonga yuklab oling: poliglot.apk"
